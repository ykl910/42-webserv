<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/css/style.css">
   <link rel="icon" href="/assets/icon.png" type="image/png">
   <title>Session Control</title>
</head>
<body>
    <nav class="navbar">
        <div class="left-side">
            <img src="/images/post42logo.png" alt="logo" class="logo" />
            <a href="/html/about.html">about us</a>
            <a href="/html/index.html">latest posts</a>
        </div>
        <div class="site-name">post42_</div>
        <div class="right-side">
            <a href="/html/upload.html" class="upload">upload</a>
            <a href="/html/remove.html" class="upload">remove</a>
            <a href="/html/game.html" class="upload">wtf</a>
            <a href="/html/cookies.html" class="upload">cookies</a>
        </div>
    </nav>
   <main>
   <h1>Session Control</h1>
   <div class="upload">
      <div class="form-group button-group">
         <button id="sessionBtn" class="upload-btn"></button>
      </div>
   </div>
   </main>

   <script>
      function getCookie(name) {
         const value = `; ${document.cookie}`;
         const parts = value.split(`; ${name}=`);
         if (parts.length === 2) return parts.pop().split(';').shift();
      }

      function updateButton() {
         const sessionId = getCookie("sessionid");
         const btn = document.getElementById("sessionBtn");
         console.log("updateButton called. sessionId:", sessionId);

         if (sessionId) {
            btn.textContent = "End Session";
            btn.onclick = async function () {
               console.log("End Session clicked");

               try {
                  const res = await fetch("/cgi/bin/cookies.py", {
                     method: "POST",
                     headers: {"Content-Type": "application/json"},
                     body: JSON.stringify({ action: "end" }),
                     credentials: "same-origin"
                  });
                  if (res.ok) {
                     alert("Session ended!");
                     updateButton();
                  } else {
                     alert("Failed to end session.");
                  }
               } catch (err) {
                  alert("Error: " + err.message);
               }
            };
         } else {
            btn.textContent = "Start Session";
            btn.onclick = async function () {
               console.log("start Session clicked");
               try {
                  const res = await fetch("/cgi/bin/cookies.py", {
                     method: "POST",
                     headers: {"Content-Type": "application/json"},
                     body: JSON.stringify({ action: "start" }),
                     credentials: "same-origin"
                  });
                  console.log("Start Session fetch response:", res);
                  if (res.ok) {
                     alert("Session started!");
                     console.log("Calling updateButton after start session");
                     setTimeout(updateButton, 500);
                  } else {
                     alert("Failed to start session.");
                  }
               } catch (err) {
                  alert("Error: " + err.message);
               }
            };
         }
      }

      window.addEventListener("DOMContentLoaded", updateButton);
   </script>
</body>
</html>
