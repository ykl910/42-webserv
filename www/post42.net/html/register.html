<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/css/style.css">
   <link rel="icon" href="/asset/image/icon.png" type="image/png">
   <title>Upload</title>
</head>
<body>
    <nav class="navbar">
        <div class="left-side">
            <img src="/asset/image/post42logo.png" alt="logo" class="logo" />
            <a href="/html/about.html">about us</a>
            <a href="/html/index.html">latest posts</a>
        </div>
        <div class="site-name">post42_</div>
        <div class="right-side">
            <a href="/html/upload.html" class="upload">upload</a>
            <a href="/html/remove.html" class="upload">remove</a>
            <a href="/html/game.html" class="upload">wtf</a>
            <a href="/html/login.html" class="upload">login</a>
        </div>
    </nav>
   <main>
   <h1>Register</h1>
   <div class="upload">
      <form id="registerForm" method="POST" enctype="multipart/form-data">
         <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
         </div>
         <div class="form-group">
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter email" required autocomplete="off">
         </div>
         <div class="form-group">
            <label for="password">Password:</label>
            <input type="text" id="password" name="password" placeholder="Enter password" required autocomplete="off">
         </div>
         <div class="form-group button-group">
         <button type="submit" class="upload-btn">Register</button>
         </div>
      </form>
   </div>

   <script>
      window.addEventListener("DOMContentLoaded", function () {
         document.getElementById("registerForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            console.log("Submitting with JS fetch.");

            const form = e.target;
            const formData = new FormData(form);

            try {
               const res = await fetch("/register", {
                  method: "POST",
                  body: formData,
               });

               const text = await res.text();

               if (res.ok) {
                  alert("User created, you may login now");
                  location.href = "/login.html";
               } else {
                  alert("Registration failed: " + text);
               }
            } catch (err) {
               alert("Error during registration: " + err.message);
            }
         });
      });
   </script>

   </main>


</body>
</html>
