<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <link rel="icon" href="../assets/icon.png" type="image/png">
   <title>Upload</title>
</head>

<body>
   <!-- BARRE DE NAVIGATION -->
   <nav class="navbar">
      <div class="left-side">
         <img src="../images/post42logo.png" alt="logo" class="logo" />
         <a href="about.html">about us</a>
         <a href="index.html">latest posts</a>
      </div>
      <div class="site-name">post42_</div>
      <div class="right-side">
         <a href="upload.html" class="upload">upload</a>
         <a href="remove.html" class="upload">remove</a>
      </div>
   </nav>

   <main>
      <h1>Remove post</h1>
      <div class="gif">
         <img src="../assets/remove.webp" alt="Animated GIF">
      </div>
      <div class="upload">
         <h3>Write your post</h3>
         <form action="/delete" method="POST" enctype="multipart/form-data">
            <!-- Hidden input to specify this is a delete request -->
            <input type="hidden" name="_method" value="DELETE">

            <!-- Optional input to specify type: file or dir -->
            <label for="path">Path to delete (file or directory):</label>
            <input type="text" name="path" id="path" required>

            <button type="submit">Delete</button>
         </form>
      </div>
   </main>

   <script>
      const fileInput = document.getElementById('fileToDelete');
      const fileChosen = document.getElementById('file-chosen');

      fileInput.addEventListener('change', function () {
         if (this.files && this.files.length > 0) {
            fileChosen.textContent = this.files[0].name;
         } else {
            fileChosen.textContent = 'No file chosen';
         }
      });
   </script>
</body>
</html>
