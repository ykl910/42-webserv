# You can take inspiration from the ’server’ section of the NGINX
# configuration file.
# In the configuration file, you should be able to:

http { # HTTP CONTEXT
    server { # SERVER CONTEXT
        # Choose the port and host of each ’server’.
        # The first server for a host:port will be the default for this
        # host:port (meaning it will respond to all requests that do not belong
        # to another server).
        listen localhost:8080; # default_server for localhost:8080

        # Set up the server_names or not.
        server_name webserv.com www.webserv.com

        # Set the maximum allowed size for client request bodies.
        client_max_body_size 10m; # megabytes

        # Set up default error pages.
        # 4xx Client Error
        # 400 Bad Request
        # 401 Unauthorized
        # 402 Payment Required
        # 403 Forbidden
        # 404 Not Found
        # 405 Method Not Allowed
        # 406 Not Acceptable
        # 407 Proxy Authentication Required
        # 408 Request Timeout
        # 409 Conflict
        # 410 Gone
        # 411 Length Required
        # 412 Precondition Failed
        # 413 Payload Too Large
        # 414 URI Too Long
        # 415 Unsupported Media Type
        # 416 Range Not Satisfiable
        # 417 Expectation Failed
        # 418 I'm a teapot
        # 421 Misdirected Request
        # 422 Unprocessable Entity
        # 423 Locked
        # 424 Failed Dependency
        # 425 Too Early
        # 426 Upgrade Required
        # 428 Precondition Required
        # 429 Too Many Requests
        # 431 Request Header Fields Too Large
        # 451 Unavailable For Legal Reasons
        error_page 404 /404.html;
        error_page 401 402 403 40x /40x.html;

        # 5xx Server Error
        # 500 Internal Server Error
        # 501 Not Implemented
        # 502 Bad Gateway
        # 503 Service Unavailable
        # 504 Gateway Timeout
        # 505 HTTP Version Not Supported
        # 506 Variant Also Negotiates
        # 507 Insufficient Storage
        # 508 Loop Detected
        # 510 Not Extended
        # 511 Network Authentication Required
        error_page 500 502 503 50x /50x.html;

        # Define an HTTP redirect.
        # 300 Multiple Choices
        # 301 Moved Permanently
        # 302 Found
        # 303 See Other
        # 304 Not Modified
        # 305 Use Proxy
        # 307 Temporary Redirect
        # 308 Permanent Redirect
        return 301 /new-page
        return 301 https://example.com$request_uri;
        return 302 /new-location;

        # ◦Define a directory or file where the requested file should be
        # located (e.g., if url /kapouet is rooted to /tmp/www, url
        # /kapouet/pouic/toto/pouet is /tmp/www/pouic/toto/pouet).
        location /kapouet {
            root /tmp/www;

            index index.html;

            autoindex on;
        }

        # ◦Enable or disable directory listing.
        autoindex on; or off -> return 403 or 404

        # ◦Set a default file to serve when the request is for a directory.
        index index.html index.htm;

        # ◦Execute CGI based on certain file extension (for example .php).
        cgi .php /usr/bin/php-cgi;
        cgi .pl  /usr/bin/perl;
        cgi .py  /usr/bin/python3;

        # ◦Make it work with POST and GET methods.

        # ◦Allow the route to accept uploaded files and configure where they
        # should be saved.

        # ∗Do you wonder what a CGI is?

        # ∗Because you won’t call the CGI directly, use the full path as
        # PATH_INFO.

        # ∗Just remember that, for chunked requests, your server needs to
        # unchunk them, the CGI will expect EOF as the end of the body.

        # ∗The same applies to the output of the CGI. If no content_length is
        # returned from the CGI, EOF will mark the end of the returned data.

        # ∗Your program should call the CGI with the file requested as the first
        # argument.

        # ∗The CGI should be run in the correct directory for relative path
        # file access.

        # ∗Your server should support at least one CGI (php-CGI, Python, and so
        # forth).

        # Set up routes with one or multiple of the following
        # rules/configurations
        # (routes won’t be using regexp):
        # ◦Define a list of accepted HTTP methods for the route.
    }

    server {
        listen localhost:8080;

        # server_name webserv.com www.webserv.com
        # - No server_name means this server will respond to requests without
        # - matching server_name
        # - (usually the default server for this host:port)
    }
}

# You must provide configuration files and default files to test and
# demonstrate that every feature works during the evaluation.
# If you have a question about a specific behavior, you should compare
# your program’s behavior with NGINX’s.
# For example, check how the server_name works.
# We have provided a small tester. Using it is not mandatory if
# everything works fine with your browser and tests, but it can help
# you find and fix bugs.

# Resilience is key. Your server must remain operational at all times.

# Do not test with only one program. Write your tests in a more
# suitable language, such as Python or Golang, among others, even
# in C or C++ if you prefer.
