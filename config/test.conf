server:
    listen 8080
    host localhost
    server_name webserv.net
    client_max_body_size 10m
    autoindex yes
    location:
        root www/webserv.net
        index index.html
    error_page:
        400 html/error/400.html
        403 html/error/403.html
        404 html/error/404.html
        500 html/error/500.html

server:
    listen 4040
    host localhost
    server_name post42.net
    client_max_body_size 20m
    autoindex yes
    location:
        root www/post42.net
        index index.html
    error_page:
        400 html/400.html
        403 html/403.html
        404 html/404.html
        500 html/500.html
