server:
    server_name webserv.com
    listen localhost:8080
    client_max_body_size 10m
    error_page:
        404 /404.html
        40x /40x.html
        500 /500.html
        500x /50x.html
    redirection:
        301 /new-page
    location:
        /kapouet:
            root /tmp/www
            index index.html
    cgi:
        .php /usr/bin/php-cgi
        .pl /usr/bin/perl
        .py /usr/bin/python3

server:
    server_name none
    listen localhost:4242
    location:

server:
    server_name none
    listen localhost:4141
    location:
