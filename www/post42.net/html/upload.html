<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/css/style.css">
   <link rel="icon" href="/asset/image/icon.png" type="image/png">
   <title>Upload</title>
</head>
<body>
    <nav class="navbar">
        <div class="left-side">
            <img src="/asset/image/post42logo.png" alt="logo" class="logo" />
            <a href="/html/about.html">about us</a>
            <a href="/html/index.html">latest posts</a>
        </div>
        <div class="site-name">post42_</div>
        <div class="right-side">
            <a href="/html/upload.html" class="upload">upload</a>
            <a href="/html/remove.html" class="upload">remove</a>
            <a href="/html/game.html" class="upload">wtf</a>
            <a href="/html/cookies.html" class="upload">cookies</a>
        </div>
    </nav>
   <main>
      <h1>New post</h1>
      <div class="gif">
         <img src="/asset/gif/writing.gif" alt="Animated GIF">
      </div>
      <div class="upload">
         <h3>Write your post</h3>
         <form action="/upload" method="POST" enctype="multipart/form-data">
            <div class="form-group">
               <label for="title">Title:</label>
               <input type="text" id="title" name="title" placeholder="Enter a title" required autocomplete="off">
            </div>
            <div class="form-group">
               <label for="body">Body:</label>
               <textarea id="body" name="body" rows="5" placeholder="Write your content here." required></textarea>
            </div>
            <div class="form-group file-upload">
               <label for="uploadFile" class="file-label">Choose an image</label>
               <input type="file" name="uploadFile" id="uploadFile" class="file-input" required accept=".jpeg,.jpg,.png,image/jpeg,image/png">
               <span id="file-chosen">No file chosen</span>
            </div>
            <div class="form-group">
               <button type="submit" class="upload-btn">Upload your post</button>
            </div>
         </form>
      </div>
   </main>
   <script>
      const fileInput = document.getElementById('uploadFile');
      const fileChosen = document.getElementById('file-chosen');

      fileInput.addEventListener('change', function () {
         const file = this.files[0];
         if (file) {
            fileChosen.textContent = file.name;
            // const maxSize = 2 * 1024 * 1024;
            // if (file.size > maxSize) {
            //    alert("File is too large. Maximum size allowed is 2MB.");
            //    this.value = "";
            //    fileChosen.textContent = "No file chosen";
            // }
         } else {
            fileChosen.textContent = 'No file chosen';
         }
      });

      const form = document.querySelector('form[action="/upload"]'); form.addEventListener('submit', async (e) => { e.preventDefault(); const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
         const resp = await fetch(form.action, { method: 'POST', body: new FormData(form)});
         if (resp.status === 201) {
            const target = resp.headers.get('Location') || '/html/uploadSuccess.html';
            window.location.assign(target);
         } else {
            const msg = await resp.text().catch(() => '');
            alert('Upload failed: ' + resp.status + (msg ? ' — ' + msg.slice(0,200) : ''));
         }
         } catch {
            alert('Network error');
         } finally {
            btn.disabled = false;
         }
      });
   </script>
</body>
</html>
