server:
    listen 8080
    host localhost
    server_name post42.net
    client_max_body_size 20m
    root www/post42.net
    location: /
        root www/post42.net
        index html/index.html
        autoindex off
        method GET POST DELETE
    location: /html
        root www/post42.net/html
        index index.html
        autoindex off
        method GET POST DELETE
    location: /html/sub
        root www/post42.net/html/sub
        index subIndex.html
        autoindex off
        method GET POST DELETE
    error_page:
        400 html/400.html
        403 html/403.html
        404 html/404.html
        405 html/405.html
        500 html/500.html
        501 html/501.html
    redirection:
        301 www/post42.net/html/redirection1.html https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/301
        302 www/post42.net/html/redirection2.html https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/302
    cgi:
        .py cgi/bin
        .php cgi/bin
        .pl cgi/bin
        .cgi cgi/bin

server:
    listen 7070
    host localhost
    server_name webserv.net
    client_max_body_size 20m
    root www/webserv.net
    location: /
        root www/webserv.net
        index html/index.html
        autoindex off
        method GET POST DELETE
    location: /html
        root www/webserv.net/html
        index index.html
        autoindex off
        method GET POST DELETE
    location: /html/request
        root www/webserv.net/html/request
        index index.html
        autoindex on
        method GET POST DELETE
    location: /css
        root www/webserv.net/css
        index style.css
        autoindex on
        method GET
    error_page:
        400 html/error/4xx/400.html
        403 html/error/4xx/403.html
        404 html/error/4xx/404.html
        405 html/error/4xx/405.html
        500 html/error/5xx/500.html
        501 html/error/5xx/501.html
    redirection:
        301 www/post42.net/html/redirection1.html https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/301
        302 www/post42.net/html/redirection2.html https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/302
    cgi:
        .py cgi/bin
        .php cgi/bin
        .pl cgi/bin
        .cgi cgi/bin

