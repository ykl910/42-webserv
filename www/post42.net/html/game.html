<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>post42_</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/asset/image/icon.png" type="image/png">
</head>
<body>
    <nav class="navbar">
        <div class="left-side">
            <img src="/asset/image/post42logo.png" alt="logo" class="logo" />
            <a href="/html/about.html">about us</a>
            <a href="/html/index.html">latest posts</a>
        </div>
        <div class="site-name">post42_</div>
        <div class="right-side">
            <a href="/html/upload.html" class="upload">upload</a>
            <a href="/html/remove.html" class="upload">remove</a>
            <a href="/html/game.html" class="upload">wtf</a>
            <a href="/html/cookies.html" class="upload">cookies</a>
        </div>
    </nav>

    <main>
        <h1>MINIGAMES</h1>

        <h2>Russian Roulette</h2>
        <div class="gif">
            <img src="/asset/gif/roulette.gif" alt="Animated GIF">
        </div>
        <form id="roulette-form" method="GET">
            <center>
                <p>Select a number between 1 and 2</p>
                <input name="number" type="number" min="1" max="2" required>
                <br><br>
                <button type="submit">Fire!</button>
            </center>
        </form>
        <div id="roulette-result" class="result-box"></div>

        <h2>Magic 8 Ball</h2>
        <div class="gif">
            <img src="/asset/gif/8ball.gif" alt="Magic 8 Ball GIF">
        </div>
        <form id="8ball-form" method="POST">
            <center>
                <p>Ask your question to the mighty 8 Ball</p>
                <input name="question" type="text" required>
                <br><br>
                <button type="submit">Ask!</button>
            </center>
        </form>
        <div id="8ball-result" class="result-box"></div>
    </main>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const rouletteForm = document.getElementById("roulette-form");
        const rouletteResult = document.getElementById("roulette-result");

        rouletteForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const number = rouletteForm.number.value;

            fetch("/cgi/bin/roulette.cgi?number=" + encodeURIComponent(number))
                .then(response => response.text())
                .then(text => {
                    rouletteResult.innerText = text;
                })
                .catch(error => {
                    rouletteResult.innerText = "Error: " + error;
                });
        });

        const ballForm = document.getElementById("8ball-form");
        const ballResult = document.getElementById("8ball-result");

        ballForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const formData = new FormData(ballForm);
            const params = new URLSearchParams();
            for (const pair of formData) {
                params.append(pair[0], pair[1]);
            }

            fetch("/cgi/bin/magicBall.cgi", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: params.toString()
            })
            .then(response => response.text())
            .then(text => {
                ballResult.innerText = text;
            })
            .catch(error => {
                ballResult.innerText = "Error: " + error;
            });
        });
    });
    </script>
</body>
</html>
