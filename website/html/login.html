   <main>
   <h1>Login</h1>
   <div class="upload">
      <form action="/login" method="POST" enctype="multipart/form-data" id="loginForm">
         <input type="hidden" name="action" id="actionType" value="login">
         <div class="form-group">
         <label for="username">Username:</label>
         <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
         </div>
         <div class="form-group">
         <label for="password">Password:</label>
         <input type="text" id="password" name="password" placeholder="Enter password" required autocomplete="off">
         </div>
         <div class="form-group button-group">
         <button type="submit" class="upload-btn login-btn">Login</button>
         <button type="button" id="registerBtn" class="upload-btn register-btn">Register</button>
         </div>
      </form>
   </div>
   </main>
