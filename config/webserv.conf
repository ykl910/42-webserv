server:
    listen 8080
    host localhost
    server_name webserv.net
    client_max_body_size 20m
    location: /
        root www/webserv.net
        index html/index.html
        autoindex on
        method GET POST DELETE
    location: /html
        root www/webserv.net/html
        index index.html
        autoindex on
        method GET POST DELETE
    location: /cacahuete
        root www/webserv.net/html
        index index.html
        autoindex on
        method GET POST DELETE
    error_page:
        400 html/error/4xx/400.html
        403 html/error/4xx/403.html
        404 html/error/4xx/404.html
        500 html/error/5xx/500.html
        501 html/error/5xx/501.html
    redirection:
        300 page page-redirection
        301 page page-redirection
        302 page page-redirection
    cgi:
        .py cgi-name
        .php cgi-name
        .perl cgi-name
        .c cgi-name
        .cpp cgi-name

