<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="../css/style.css">
   <link rel="icon" href="../assets/icon.png" type="image/png">
   <title>Upload</title>
</head>
<body>
   <nav class="navbar">
      <div class="left-side">
         <img src="../images/post42logo.png" alt="logo" class="logo" />
         <a href="about.html">about us</a>
         <a href="index.html">latest posts</a>
      </div>
      <div class="site-name">post42_</div>
      <div class="right-side">
         <a href="upload.html" class="upload">upload</a>
         <a href="remove.html" class="upload">remove</a>
      </div>
   </nav>
   <main>
      <h1>Remove post</h1>
      <div class="gif">
         <img src="../assets/remove.webp" alt="Animated GIF">
      </div>
      <div class="upload">
      <h2>Choose a file to delete:</h2>

      <select id="fileSelect">
         <option>Loading files...</option>
      </select>
      <button onclick="deleteSelected()">Delete</button>

      <script>
         // Fetch the list of files from your server
         fetch('/list-files')
            .then(res => res.json()) // Expecting JSON array: ["file1.txt", "file2.txt"]
            .then(files => {
            const select = document.getElementById('fileSelect');
            select.innerHTML = ''; // Clear existing options

            files.forEach(file => {
               const option = document.createElement('option');
               option.value = file;
               option.textContent = file;
               select.appendChild(option);
            });
            })
            .catch(err => {
            console.error('Error fetching file list:', err);
            document.getElementById('fileSelect').innerHTML = '<option>Error loading files</option>';
            });

         // Handle delete action
         function deleteSelected() {
            const file = document.getElementById('fileSelect').value;
            if (!file) return alert('No file selected.');

            if (confirm(`Delete "${file}"?`)) {
            fetch(`/delete/${file}`, { method: 'DELETE' })
               .then(res => {
                  if (res.ok) alert(`${file} deleted.`);
                  else alert(`Failed to delete: ${res.status}`);
               });
            }
         }
      </script>
      </div>
   </main>
   <script>
      const fileInput = document.getElementById('fileToDelete');
      const fileChosen = document.getElementById('file-chosen');

      fileInput.addEventListener('change', function () {
         if (this.files && this.files.length > 0) {
            fileChosen.textContent = this.files[0].name;
         } else {
            fileChosen.textContent = 'No file chosen';
         }
      });
   </script>
</body>
</html>
