<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="/css/style.css">
   <script>
      // Check for login cookie on page load
      document.addEventListener('DOMContentLoaded', function() {

         console.log("Raw cookie string:", document.cookie);
         if (document.cookie.includes('session=')) {
            console.log("Session cookie found by direct check!");
            window.location.href = 'isLogged.html';
            return;
         }
      });
    </script>
   <link rel="icon" href="/asset/image/icon.png" type="image/png">
   <title>Upload</title>
</head>
<body>
    <nav class="navbar">
        <div class="left-side">
            <img src="/asset/image/post42logo.png" alt="logo" class="logo" />
            <a href="/html/about.html">about us</a>
            <a href="/html/index.html">latest posts</a>
        </div>
        <div class="site-name">post42_</div>
        <div class="right-side">
            <a href="/html/upload.html" class="upload">upload</a>
            <a href="/html/remove.html" class="upload">remove</a>
            <a href="/html/game.html" class="upload">wtf</a>
            <a href="/html/login.html" class="upload">login</a>
        </div>
    </nav>
   <main>
   <h1>Login</h1>
   <div class="upload">
      <form id="loginForm" method="POST" enctype="multipart/form-data">
         <div class="form-group">
         <label for="username">Username:</label>
         <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
         </div>
         <div class="form-group">
         <label for="password">Password:</label>
         <input type="text" id="password" name="password" placeholder="Enter password" required autocomplete="off">
         </div>
         <div class="form-group button-group">
         <button type="submit" class="upload-btn">Login</button>
         <a href="/html/register.html" class="upload-btn">Register</a>
         </div>
      </form>
   </div>
   </main>

   <script>
      window.addEventListener("DOMContentLoaded", function () {
         document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            console.log("Submitting with JS fetch.");

            const form = e.target;
            const formData = new FormData(form);

            try {
               const res = await fetch("/login", {
                  method: "POST",
                  body: formData,
               });

               const text = await res.text();

               if (res.ok) {
                  alert("You are now logged ! Welcome back :)");
                  location.href = "/index.html";
               } else {
                  alert("Incorrect credentials, please register or try again");
               }
            } catch (err) {
               alert("Error during login: " + err.message);
            }
         });
      });

   </script>
</body>
</html>
