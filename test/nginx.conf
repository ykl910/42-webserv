worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 4241;  # or 127.0.0.1:4241 if you only want localhost
        server_name _;

        root /media/algadea/extreme-ssd/dev/42/webserv/www/webserv.net;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}