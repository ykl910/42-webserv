<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>post42_</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/icon.png" type="image/png">
</head>
<body>
    <nav class="navbar">
        <div class="left-side">
            <img src="/images/post42logo.png" alt="logo" class="logo" />
            <a href="/about.html">about us</a>
            <a href="/index.html">latest posts</a>
        </div>
        <div class="site-name">post42_</div>
        <div class="right-side">
            <a href="/upload.html" class="upload">upload</a>
            <a href="/remove.html" class="upload">remove</a>
            <a href="/game.html" class="upload">wtf</a>
        </div>
    </nav>

    <main>
        <h1>MINIGAMES</h1>

        <!-- 🎯 Russian Roulette -->
        <h2>Russian Roulette</h2>
        <div class="gif">
            <img src="/assets/roulette.gif" alt="Animated GIF">
        </div>
        <form id="roulette-form">
            <center>
                <p>Select a number between 0 and 9</p>
                <input name="number" type="number" min="0" max="9" required>
                <br><br>
                <button type="submit">Fire!</button>
            </center>
        </form>
        <div id="roulette-result" class="result-box"></div>

        <!-- 🎱 Magic 8 Ball -->
        <h2>Magic 8 Ball</h2>
        <div class="gif">
            <img src="/assets/8ball.gif" alt="Magic 8 Ball GIF">
        </div>
        <form id="8ball-form">
            <center>
                <p>Ask your question to the mighty 8 Ball</p>
                <input name="question" type="text" placeholder="Will I segfault today?" required>
                <br><br>
                <button type="submit">Ask!</button>
            </center>
        </form>
        <div id="8ball-result" class="result-box"></div>
    </main>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        // Roulette logic
        const rouletteForm = document.getElementById("roulette-form");
        const rouletteResult = document.getElementById("roulette-result");

        rouletteForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const number = rouletteForm.number.value;

            fetch("/cgi-bin/roulette.cgi?number=" + encodeURIComponent(number))
                .then(response => response.text())
                .then(text => {
                    rouletteResult.innerText = text;
                })
                .catch(error => {
                    rouletteResult.innerText = "Error: " + error;
                });
        });

        // 8 Ball logic
        const ballForm = document.getElementById("8ball-form");
        const ballResult = document.getElementById("8ball-result");

        ballForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const question = ballForm.question.value;

            fetch("/cgi-bin/8ball.cgi?question=" + encodeURIComponent(question))
                .then(response => response.text())
                .then(text => {
                    ballResult.innerText = text;
                })
                .catch(error => {
                    ballResult.innerText = "Error: " + error;
                });
        });
    });
    </script>
</body>
</html>
